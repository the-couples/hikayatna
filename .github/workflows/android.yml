name: Android build
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        required: false
        default: "1.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install & sync
        working-directory: app
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json; fi
          npm ci
          node prep-www.js
          npx cap sync android
      - name: Build signed AAB
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || '1.0' }}
        run: |
          if [ -n "$KS_B64" ]; then export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"; echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"; fi
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon bundleRelease && break; echo retry $i; sleep 30; done
          ls app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: hikayatna-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
      - name: Publish AAB to android-builds branch
        run: |
          mkdir -p /tmp/out && cp app/android/app/build/outputs/bundle/release/*.aab /tmp/out/hikayatna-${{ github.run_number }}.aab
          cd /tmp/out && git init -q -b android-builds && git config user.name github-actions && git config user.email actions@github.com
          echo "run ${{ github.run_number }} from ${{ github.sha }}" > BUILD.txt
          git add -A && git commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-builds
