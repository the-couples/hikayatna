<style>
/* VOICE: tender, warm, night-sky romance taken from their own logo (gold ح, silver ل, moon), playful-but-calm — a private shared journal for two
   IDEA: a little shared scrapbook of "our moments", with a plans list and a counter of days together
   PICTURE: two interlocking monogram rings (ح + ل) with a heart where they meet, on a deep plum band
   COLOUR and TYPE: night navy band with stars and moon glow, gold accent, silver text; Aref Ruqaa calligraphy for names, El Messiri headings + IBM Plex Sans Arabic body
   LAYOUT: phone-first single column, hero band, tab content, floating add button, bottom sheets */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3fa,#0b0e24);--card:light-dark(#ffffff,#151a38);--ink:light-dark(#151a3a,#f4efe2);
--mute:light-dark(#4c5072,#cdcbe3);--line:light-dark(#e3e1ef,#272c52);--rose:light-dark(#a8721a,#efc466);--on:light-dark(#fff,#14112c);
--plum:#1a2052;--plum2:#090c24;--soft:light-dark(#f4ecda,#231f45);--gold:#f1cf83}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-phase=morning]{color-scheme:light;--bg:#fff4ef;--card:#ffffff;--ink:#3b1d3a;--mute:#5a3851;--line:#f2dcd7;--rose:#b23d5c;--soft:#fde4e1;--on:#ffffff;--gold:#ffb08a}
:root[data-phase=day]{color-scheme:light;--bg:#f3f6ff;--card:#ffffff;--ink:#1c2850;--mute:#3c4875;--line:#dde4f7;--rose:#3a58c0;--soft:#e5ebfd;--on:#ffffff;--gold:#9db8ff}
:root[data-phase=evening]{color-scheme:dark;--bg:#1d1230;--card:#2a1b43;--ink:#fbe9ef;--mute:#e2cde0;--line:#432f5e;--rose:#ff8f6b;--soft:#3a2553;--on:#2a1020;--gold:#ffb86b}
:root[data-phase=night]{color-scheme:dark;--bg:#0b0e24;--card:#151a38;--ink:#f4efe2;--mute:#cdcbe3;--line:#272c52;--rose:#efc466;--soft:#231f45;--on:#14112c;--gold:#f1cf83}
body{transition:background-color 1.2s ease,color 1.2s ease}
:root[data-phase=morning] .hero .names,:root[data-phase=day] .hero .names{color:#fff6e8}
:root[data-phase=morning] .hero .days b,:root[data-phase=day] .hero .days b,:root[data-phase=morning] .sg b,:root[data-phase=day] .sg b,:root[data-phase=morning] .ev b,:root[data-phase=day] .ev b{color:#fff6e8}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16.5px/1.6 "Tajawal",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Tajawal",system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
svg text{font-family:"Tajawal",system-ui,sans-serif}
button{font-family:"Tajawal",system-ui,sans-serif}
.date b,.row .n,.crow .n,.pv,.day,.evr .cd,.log,.streak,.n,.kpi b,.rfig b,.big,.cur,.days b,.ev b,#albn{font-family:"Tajawal",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.big,.cur,.days b,.rfig b,.date b,.ev b,.pv{font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto}
.hero{background:radial-gradient(circle at 12% 22%,rgba(255,230,170,.9) 0 1.2px,transparent 2px),radial-gradient(circle at 34% 8%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 58% 30%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 80% 12%,rgba(255,230,170,.9) 0 1px,transparent 1.6px),radial-gradient(circle at 46% 62%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 90% 70%,#fff 0 1px,transparent 1.6px),radial-gradient(55% 45% at 6% 18%,rgba(241,207,131,.28),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,var(--plum) 45%,var(--plum2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) max(5vw,18px) 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{background:rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}
.gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pic{display:flex;align-items:flex-end;gap:18px;margin-top:14px}
.logo{height:min(54vw,220px);width:auto;flex:none;filter:drop-shadow(0 0 14px rgba(241,207,131,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.names{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--gold);font-size:clamp(38px,11vw,56px);line-height:1.2}
.days{margin-top:8px;font-size:17px;opacity:.92}
.days b{font-family:"Tajawal";font-size:30px;color:var(--gold);margin-inline-end:4px}
.days button{color:var(--gold);text-decoration:underline;padding:6px 0;min-height:44px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:"Tajawal";font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;opacity:.8}
.soon{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ev{flex:none;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[{k:'out',n:'طلعة',c:'#e0336a'},{k:'food',n:'أكل',c:'#f08a4b'},{k:'travel',n:'سفر',c:'#3a8dde'},{k:'sport',n:'رياضة',c:'#2bb39a'},{k:'watch',n:'فيلم ومسلسل',c:'#8b5cf6'},{k:'event',n:'مناسبة',c:'#d4a017'},{k:'home',n:'بالبيت',c:'#b0417f'},{k:'other',n:'شي تاني',c:'#8a7684'}];
const cat=k=>CATS.find(c=>c.k===k)||CATS[7];
const catLbl=o=>o.cat==='other'&&o.catOther?esc(o.catOther):cat(o.cat).n;
const otherInput=(id,v,shown,ph)=>'<input class="in" id="'+id+'" maxlength="40" placeholder="'+ph+'" value="'+esc(v||'')+'"'+(shown?'':' hidden')+' style="margin-top:8px">';
function wireOther(box,attr,id){sheet.querySelector(box).addEventListener('click',e=>{const b=e.target.closest('['+attr+']');if(!b)return;const i=document.getElementById(id);const on=b.getAttribute(attr)==='other';i.hidden=!on;if(on)setTimeout(()=>i.focus(),60)})}
const WHO={both:'سوا',hassan:'',leen:''},G={hassan:'m',leen:'f'};let COUPLE=null;try{COUPLE=JSON.parse(localStorage.getItem('hl-couple')||'null')}catch(x){}if(COUPLE&&COUPLE.names){WHO.hassan=COUPLE.names.hassan||WHO.hassan;WHO.leen=COUPLE.names.leen||WHO.leen}if(COUPLE&&COUPLE.gender){G.hassan=COUPLE.gender.hassan||'m';G.leen=COUPLE.gender.leen||'f'}const REL={engaged:'تاريخ خطبتنا',married:'تاريخ زواجنا',dating:'تاريخ تعارفنا'};const relLbl=()=>REL[(COUPLE&&COUPLE.relation)||'engaged']||REL.engaged;const TABS=[['moments','لحظاتنا'],['album','ألبومنا'],['fit','رياضتنا'],['cal','تقويمنا'],['us','بيناتنا'],['games','ألعابنا'],['plans','خططنا'],['stats','أرقامنا']];
const L='ar-u-nu-latn';
/* perf: cache Intl formatters (toLocale* builds a new formatter every call) */
{const C=new Map(),fm=(loc,o)=>{const k=String(loc)+'|'+JSON.stringify(o);let f=C.get(k);if(!f){f=new Intl.DateTimeFormat(loc,o);C.set(k,f)}return f},D=Date.prototype,od=D.toLocaleDateString,ot=D.toLocaleTimeString;
 D.toLocaleDateString=function(loc,o){if(isNaN(this))return od.call(this,loc,o);try{return fm(loc,o||{year:'numeric',month:'numeric',day:'numeric'}).format(this)}catch(e){return od.call(this,loc,o)}};
 D.toLocaleTimeString=function(loc,o){if(isNaN(this))return ot.call(this,loc,o);try{return fm(loc,o||{hour:'numeric',minute:'numeric',second:'numeric'}).format(this)}catch(e){return ot.call(this,loc,o)}}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pd=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const heart='<svg><use href="#h"/></svg>';
let events=[],calM=null,selDay=null,photos=[],albF='all',vList=[],vIdx=-1;
let db=null,moments=[],plans=[],weights=[],notes=[],points=[],noteView='open',settings={},me='',tab='home',filter='all',q='',canWrite=true;

const weekKey=d=>{const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+1)%7));return t.getTime()};
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const bdayOf=k=>(profiles[k]&&profiles[k].bday)||(settings.bday||{})[k]||'';

/* ---------- toast ---------- */
let tt;
function toast(msg,btn,fn){$('#tmsg').textContent=msg;const b=$('#tbtn');b.textContent=btn||'';b.hidden=!btn;b.onclick=()=>{hideToast();fn&&fn()};$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(hideToast,btn?6000:2600)}

/* ---------- header ---------- */
function renderHead(){try{window.__fillSplash&&window.__fillSplash()}catch(x){}
 $('#meBtn').textContent=me?(COUPLE&&!COUPLE.legacy?'أهلا '+WHO[me]+' 🤍':'أهلا '+WHO[me]+' 🤍'):'مين أنا؟';renderSigns();
 const d=$('#days');
 if(settings.start){const n=Math.max(0,Math.floor((pd(today())-pd(settings.start))/864e5));d.innerHTML='سوا من <b>'+n.toLocaleString(L)+'</b> يوم'}
 else d.innerHTML='<button id="setStart">حطّوا تاريخ ارتباطكن</button>';
 const sb=$('#setStart');if(sb)sb.onclick=openSettings;
 renderSoon();
 const ym=today().slice(0,7);
 const month=moments.filter(m=>String(m.date).startsWith(ym)).length;
 const cnt={};moments.forEach(m=>cnt[m.cat]=(cnt[m.cat]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 if($('#kpis'))$('#kpis').innerHTML=[[month,'هالشهر'],[moments.length,'كل لحظاتنا'],[top?cat(top[0]).n:'—','أكتر شي منعملو']].map(([v,l])=>'<div class="kpi"><b>'+esc(v)+'</b><span>'+l+'</span></div>').join('');
}

function nextOf(iso){const b=pd(iso),t=pd(today());let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return {days:Math.round((n-t)/864e5),years:n.getFullYear()-b.getFullYear()}}
function renderSoon(){
 const ev=[],bd={hassan:bdayOf('hassan'),leen:bdayOf('leen')};
 if(bd.leen)ev.push({iso:bd.leen,n:'عيد ميلاد '+WHO.leen,ty:'b'});
 if(bd.hassan)ev.push({iso:bd.hassan,n:'عيد ميلاد '+WHO.hassan,ty:'b'});
 if(settings.start)ev.push({iso:settings.start,n:relLbl().replace('تاريخ','ذكرى'),ty:'a'});
 const list=ev.map(e=>({...e,...nextOf(e.iso)})).filter(e=>e.years>0||e.ty==='b').sort((a,b)=>a.days-b.days);
 {const sh=$('#soonh');if(sh)sh.hidden=!list.length}
 $('#soon').innerHTML=list.map(e=>{const what=e.ty==='b'?' ('+e.years+')':(e.years===1?' الأولى':' الـ'+e.years);const nd=new Date(pd(today()).getTime()+e.days*864e5);
  const dd='<div class="d">'+nd.getDate()+'<small>'+nd.toLocaleDateString(L,{month:'long'})+'</small></div>';
  return e.days===0?'<div class="ev today">'+dd+'<div><b>اليوم '+e.n+what+' 🎉</b><em>'+(e.ty==='b'?'كل سنة وإنت سالم'+((e.n==='عيد ميلاد '+WHO.leen&&G.leen==='f')||(e.n==='عيد ميلاد '+WHO.hassan&&G.hassan==='f')?'ة':''):'كل سنة وإنتو سوا')+'</em></div></div>':'<div class="ev">'+dd+'<div><b>'+e.n+what+(e.ty==='b'?' 🎂':' 💍')+'</b><em>بعد '+e.days+(e.days===1?' يوم':e.days<11?' أيام':' يوم')+'</em></div></div>'}).join('');
}

/* ---------- zodiac ---------- */
const ZOD=[['الجدي','01-20','تراب','زحل'],['الدلو','02-19','هوا','زحل وأورانوس'],['الحوت','03-21','مَي','المشتري ونبتون'],['الحمل','04-20','نار','المريخ'],['الثور','05-21','تراب','الزهرة'],['الجوزاء','06-21','هوا','عطارد'],['السرطان','07-23','مَي','القمر'],['الأسد','08-23','نار','الشمس'],['العذراء','09-23','تراب','عطارد'],['الميزان','10-23','هوا','الزهرة'],['العقرب','11-22','مَي','المريخ وبلوتو'],['القوس','12-22','نار','المشتري']];

 const list=moments.filter(m=>(filter==='all'||m.cat===filter)&&(!ql||(String(m.title)+' '+String(m.note||'')).includes(ql))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0));

 let out='',last='';

  if(mk!==last){out+='<div class="month">'+d.toLocaleDateString(L,{month:'long',year:'numeric'})+'</div>';last=mk}

  out+='<article class="card"><div class="date"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString(L,{weekday:'short'})+'</span></div><div class="body"><h3>'+esc(m.title)+'</h3><div class="meta"><span class="tag"><i class="dot" style="background:'+c.c+'"></i>'+catLbl(m)+'</span><span>'+esc(WHO[m.who]||'سوا')+'</span>'+hearts(Math.min(5,Math.max(0,Number(m.rating)||0)))+'</div>'+(m.note?'<p class="note">'+esc(m.note)+'</p>':'')+(m.by?'<div class="small" style="margin-top:6px">زادها '+esc(WHO[m.by]||'')+'</div>':'')+'</div><button class="more" data-edit="'+esc(m.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button></article>';
 }
 $('#list').innerHTML=out;

 return '<div class="recap"><div class="rch"><button class="nav" data-rm="-1" aria-label="الشهر الماضي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button><div><small>'+(isNow?'شهرنا لهلّق':'ملخّص شهرنا')+'</small><h2>'+sumM.toLocaleDateString(L,{month:'long',year:'numeric'})+'</h2></div><button class="nav" data-rm="1" aria-label="الشهر الجاي"'+(isNow?' disabled style="opacity:.3"':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button></div>'+
 (cover&&okImg(cover.thumb)?'<img class="rcov" alt="" src="'+cover.thumb+'">':'')+
 (mm.length||ph.length?'<div class="rfig">'+fig(mm.length,'لحظة')+fig(mm.filter(m=>m.cat==='sport').length,'تمرين')+fig(ph.length,'صورة')+fig(plans.filter(p=>p.done&&inT(p.doneAt)).length,'حلم تحقّق')+'</div>'+
  (best?'<p class="rbest"><small>أحلى لحظة</small>'+esc(best.title)+(Number(best.rating)?' '+'<span class="hearts">'+heart.repeat(Math.min(5,Number(best.rating)))+'</span>':'')+'</p>':'')+

}

 const t=pd(today());if(!calM)calM=new Date(t.getFullYear(),t.getMonth(),1);
 const all=allEvents(),y=calM.getFullYear(),m=calM.getMonth();
 const first=new Date(y,m,1),off=(first.getDay()+1)%7,start=new Date(y,m,1-off);
 let g='<div class="sec"><div class="calh"><button class="nav" data-cm="-1" aria-label="الشهر الماضي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button><h2>'+calM.toLocaleDateString(L,{month:'long',year:'numeric'})+'</h2><button class="nav" data-cm="1" aria-label="الشهر الجاي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button></div><div class="grid">'+
  ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(d=>'<div class="wd">'+d+'</div>').join('');
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),ds=iso(d);
  if(i===35&&d.getMonth()!==m)break;
  const evs=all.filter(e=>onDay(e,ds)).slice(0,3);
  g+='<button class="day'+(d.getMonth()!==m?' out':'')+(ds===today()?' td':'')+'" data-day="'+ds+'" aria-pressed="'+(ds===selDay)+'">'+d.getDate()+'<span class="ds">'+evs.map(e=>'<i style="background:'+e.c+'"></i>').join('')+'</span></button>'}
 g+='</div></div>';
 if(selDay){const evs=all.filter(e=>onDay(e,selDay));
  g+='<div class="sec"><h2>'+pd(selDay).toLocaleDateString(L,{weekday:'long',day:'numeric',month:'long'})+'</h2>'+(evs.length?evs.map(e=>evRow(e,selDay,null)).join(''):'<p class="hint">ما في شي بهاليوم.</p>')+'<div class="mini"><button class="btn pri" id="addEv">زيد شي لهاليوم</button></div></div>'}
 // upcoming
 const up=[];for(const e of all){for(let k=0;k<366;k++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+k),ds=iso(d);if(onDay(e,ds)){up.push({e,ds,k});break}}}
 up.sort((a,b)=>a.k-b.k);
 g+='<div class="sec"><h2>جايين قريب</h2>'+(up.length?up.slice(0,8).map(u=>evRow(u.e,u.ds,u.k)).join(''):'<p class="hint">سجّلوا أول يوم مهم جايي: سفرة، عزيمة، كتب كتاب…</p>')+'</div>';
 el.innerHTML=g;
}
function evRow(e,ds,k){
 const cd=k==null?(e.time?'<b>'+esc(e.time)+'</b>':'<b>·</b>'):k===0?'<b>اليوم</b>':k===1?'<b>بكرا</b>':'بعد<b>'+k+'</b>يوم';
 return '<div class="evr"><div class="cd">'+cd+'</div><div class="body"><h3 style="font-size:16px;margin:0"><i class="dot" style="display:inline-block;background:'+e.c+';margin-inline-end:6px"></i>'+esc(label(e,ds))+'</h3><div class="small" style="margin:2px 0 0">'+pd(ds).toLocaleDateString(L,{weekday:'short',day:'numeric',month:'short'})+(e.time?' · '+esc(e.time):'')+(e.kind==='other'&&e.kindOther?' · '+esc(e.kindOther):'')+(e.yearly&&!e.auto?' · كل سنة':'')+(e.note?' · '+esc(e.note):'')+'</div></div>'+(e.auto?'':'<button class="more" data-eedit="'+esc(e.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>')+'</div>';
}

 open('<h2>'+(e.id?'عدّل اليوم':'يوم مهم جايي')+'</h2><form id="ef"><label class="l" for="e-t">شو المناسبة؟</label><input class="in" id="e-t" required maxlength="120" placeholder="مثلاً: سفرتنا عإسطنبول" value="'+esc(e.title||'')+'">'+

 '<label class="l">بتتكرّر؟</label><div class="seg" id="eyr"><button type="button" data-y="0" aria-pressed="'+(!e.yearly)+'">مرة وحدة</button><button type="button" data-y="1" aria-pressed="'+(!!e.yearly)+'">كل سنة</button></div>'+
 '<label class="l" for="e-n">ملاحظة</label><input class="in" id="e-n" maxlength="200" placeholder="وين، مع مين، شو لازم نحضّر…" value="'+esc(e.note||'')+'">'+
 '<div class="acts">'+(e.id?'<button type="button" class="btn del" id="edel">احذف</button>':'')+'<button class="btn pri" type="submit">'+(e.id?'احفظ':'زيدو')+'</button></div></form>');
 pick('#ekind','data-c');pick('#eyr','data-y');wireOther('#ekind','data-c','e-ok');
 $('#ef').addEventListener('submit',async ev=>{ev.preventDefault();const title=$('#e-t').value.trim(),date=$('#e-d').value;if(!title||!date)return;
  const doc={title,date,time:$('#e-h').value||'',kind:val('#ekind','data-c')||'other',kindOther:val('#ekind','data-c')==='other'?$('#e-ok').value.trim():'',yearly:val('#eyr','data-y')==='1',note:$('#e-n').value.trim(),by:e.by||me||'',createdAt:e.createdAt||Date.now(),updatedAt:Date.now()};close();
  selDay=date;calM=new Date(pd(date).getFullYear(),pd(date).getMonth(),1);
  await write(()=>e.id?db.collection('events').doc(e.id).set(doc):db.collection('events').add(doc),e.id?'انحفظ':'انزاد عالتقويم');renderCal()});
 const d=$('#edel');if(d)d.onclick=async()=>{const copy={...e};delete copy.id;delete copy.c;close();await write(()=>db.collection('events').doc(e.id).delete());toast('انحذف','تراجع',()=>write(()=>db.collection('events').doc(e.id).set(copy),'رجع'))};
}
$('#cal').addEventListener('click',e=>{
 const n=e.target.closest('[data-cm]');if(n){calM=new Date(calM.getFullYear(),calM.getMonth()+Number(n.dataset.cm),1);return renderCal()}
 const d=e.target.closest('[data-day]');if(d){selDay=selDay===d.dataset.day?null:d.dataset.day;return renderCal()}
 if(e.target.closest('#addEv'))return openEvent(null,selDay);
 const ed=e.target.closest('[data-eedit]');if(ed){const x=events.find(v=>v.id===ed.dataset.eedit);if(x)openEvent(x)}
});

/* ---------- letters ---------- */
const envSvg='<svg class="env" viewBox="0 0 48 36" aria-hidden="true"><rect x="2" y="2" width="44" height="32" rx="5"/><path d="M3 5l21 16L45 5"/><use href="#h" x="18" y="17" width="12" height="12"/></svg>';
const opV=k=>G[k]==='f'?'فتحت':'فتح';
const openedWhen=t=>{const d=new Date(t);return d.toLocaleDateString(L,{day:'numeric',month:'short'})+' الساعة '+d.toLocaleTimeString(L,{hour:'numeric',minute:'2-digit'})};
function notifyOpened(){if(!me)return;let seen={};try{seen=JSON.parse(localStorage.getItem('hl-seen')||'{}')}catch(x){}
 const fresh=letters.filter(l=>l.from===me&&l.openedAt&&!seen[l.id]);if(!fresh.length)return;
 fresh.forEach(l=>seen[l.id]=1);try{localStorage.setItem('hl-seen',JSON.stringify(seen))}catch(x){}
 const o=fresh[0].to;toast(fresh.length===1?WHO[o]+' '+opV(o)+' رسالتك «'+(fresh[0].title||'رسالة')+'»':WHO[o]+' '+opV(o)+' '+fresh.length+' من رسائلك','شوف',()=>goTab('us'))}
const dleft=iso=>Math.round((pd(iso)-pd(today()))/864e5);
function lettersHtml(){
 if(!me)return '';
 const inbox=letters.filter(l=>l.to===me).sort((a,b)=>String(a.openAt).localeCompare(String(b.openAt))),sent=letters.filter(l=>l.from===me).sort((a,b)=>String(a.openAt).localeCompare(String(b.openAt)));
 const row=(l,mine)=>{const n=dleft(l.openAt),ready=n<=0,when=pd(l.openAt).toLocaleDateString(L,{day:'numeric',month:'long',year:'numeric'});
  return '<div class="lt'+(ready&&!mine?' ready':'')+'">'+envSvg+'<div class="body"><b>'+esc(l.title||'رسالة')+'</b><div class="small" style="margin:2px 0 0">'+(mine?'منك '+LI(l.to)+' · '+(l.openedAt?'<span class="seen">✓ '+WHO[l.to]+' '+opV(l.to)+'ها '+openedWhen(l.openedAt)+'</span>':ready?'وصلت، '+(G[l.to]==='f'?'لسّا ما فتحتها':'لسّا ما فتحها'):'بتنفتح '+when):(l.openedAt?'<span class="seen">✓ فتحتها '+openedWhen(l.openedAt)+'</span>':ready?'وصلت! صار فيك تفتحها':'مقفولة · بتنفتح بعد '+n+' يوم'))+'</div></div>'+
   (mine&&l.openedAt?'':mine?'<button class="more" data-ledit="'+esc(l.id)+'" aria-label="عدّل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>':'<button class="lbtn'+(ready?'':' lock')+'" data-lopen="'+esc(l.id)+'">'+(ready?'افتحها':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>')+'</button>')+'</div>'};
 return '<div class="sec"><h2>رسائل للمستقبل</h2>'+(inbox.length?inbox.map(l=>row(l,false)).join(''):'<p class="hint" style="margin:0">لسّا ما في رسائل إلك.</p>')+
  (sent.length?'<div class="month" style="margin:14px 0 2px">بعتّها إنت</div>'+sent.map(l=>row(l,true)).join(''):'')+
  '<div class="mini"><button class="btn pri" id="addLetter">اكتب رسالة '+LI(other(me))+'</button></div><p class="hint">بتنقفل لتاريخ بتختارو، وما حدا بيقدر يقراها قبل، حتى لو حاول.</p></div>';
}

async function readLetter(l){

/* ---------- between us ---------- */
const LI=k=>k==='leen'||k==='hassan'?'لـ'+WHO[k]:'';
const other=k=>k==='hassan'?'leen':'hassan';
const ago=t=>new Date(t||Date.now()).toLocaleDateString(L,{day:'numeric',month:'short'});
const sgn=n=>'\u2066'+(n>0?'+':'')+n+'\u2069';
function renderUs(){queueFeed();
 const el=$('#us');if(!el)return;
 const ym=today().slice(0,7),tot={},mon={};
 for(const k of ['hassan','leen']){const mine=points.filter(p=>p.to===k);tot[k]=mine.reduce((a,p)=>a+(Number(p.pts)||0),0);mon[k]=mine.filter(p=>new Date(p.createdAt||0).toISOString().slice(0,7)===ym).reduce((a,p)=>a+(Number(p.pts)||0),0)}
 const pl=[...points].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,12);
 let out='<div class="sec"><h2>نقاطنا</h2><div class="score">'+['hassan','leen'].map(k=>'<div><div class="small" style="margin:0">'+WHO[k]+'</div><div class="big'+(tot[k]<0?' neg':'')+'">'+sgn(tot[k])+'</div><div class="small" style="margin:0">هالشهر '+sgn(mon[k])+'</div></div>').join('')+'</div>'+
 '<div class="mini"><button class="btn pri" id="givePts">عطي نقاط</button></div>'+
 (pl.length?'<div style="margin-top:12px">'+pl.map(p=>{const v=Number(p.pts)||0;return '<div class="pt"><span class="pv'+(v<0?' neg':'')+'">'+sgn(v)+'</span><div class="body">'+esc(p.reason||'')+'<div class="small">'+esc(WHO[p.from]||'')+' ← '+esc(WHO[p.to]||'')+' · '+ago(p.createdAt)+'</div></div>'+(p.from===me?'<button class="x" data-pdel="'+esc(p.id)+'" aria-label="احذف">×</button>':'')+'</div>'}).join('')+'</div>':'<p class="hint">لسّا ما حدا عطى نقاط. أول شغلة حلوة بتستاهل نقطة!</p>')+'</div>';
 out+=lettersHtml();
 const open=notes.filter(n=>!n.ok),closed=notes.filter(n=>n.ok);
 const nl=(noteView==='open'?open:closed).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 out+='<div class="sec"><h2>ملاحظات لبعض</h2><div class="seg" id="nview"><button data-nv="open" aria-pressed="'+(noteView==='open')+'">مفتوحة ('+open.length+')</button><button data-nv="closed" aria-pressed="'+(noteView==='closed')+'">خلصنا منها ('+closed.length+')</button></div>'+
 '<div class="mini"><button class="btn pri" id="addNote">اكتب ملاحظة</button></div><p class="hint">احكوا عن الموقف مش عن الشخص، واكتبوا شو بتحبوا يصير بدالو.</p></div>';
 out+=nl.length?nl.map(n=>{const th=n.kind==='thanks';return '<article class="card nt'+(th?' thanks':'')+(n.ok?' ok':'')+'"><div class="body"><div class="meta" style="margin-bottom:4px"><span>'+(th?'شكر':'ملاحظة')+' من '+esc(WHO[n.from]||'')+' '+LI(n.to)+'</span><span>'+ago(n.createdAt)+'</span></div><p class="note" style="margin:0">'+esc(n.text)+'</p>'+(n.reply?'<p class="note small" style="margin-top:6px">ردّ '+esc(WHO[n.to]||'')+': '+esc(n.reply)+'</p>':'')+
  (!n.ok&&n.to===me?'<button class="ok-btn" data-nok="'+esc(n.id)+'">'+(th?'تسلم/ي، وصلت':'فهمت عليك، رح انتبه')+'</button>':'')+'</div>'+(n.from===me?'<button class="more" data-nedit="'+esc(n.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>':'')+'</article>'}).join(''):'<div class="empty">'+(noteView==='open'?'ما في ملاحظات مفتوحة. حلو!':'لسّا ما في شي هون')+'</div>';
 el.innerHTML=out;
}

{let y0=null,dy=0,on=false,raf=0,samples=[];
 const H=()=>sheet.offsetHeight||600;
 const paint=()=>{raf=0;const d=dy>0?dy:dy/6;sheet.style.transform='translate3d(0,'+d.toFixed(1)+'px,0)';scrim.style.opacity=String(Math.max(.15,1-Math.max(0,dy)/(H()*1.05)))};
 sheet.addEventListener('touchstart',e=>{if(e.touches.length!==1){y0=null;return}const g=e.target.closest('.grab');if(!g&&sheet.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;dy=0;on=false;samples=[{y:y0,t:performance.now()}]},{passive:true});
 sheet.addEventListener('touchmove',e=>{if(y0==null)return;const y=e.touches[0].clientY;dy=y-y0;
  const now=performance.now();samples.push({y,t:now});while(samples.length>2&&now-samples[0].t>90)samples.shift();
  if(!on){if(dy>4&&sheet.scrollTop<=0){on=true;y0=y;dy=0;clearTimeout(sheetT);sheet.classList.add('drag');sheet.style.transition='none';scrim.style.transition='none';const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur()}else if(dy<-4){y0=null;return}else return}
  e.preventDefault();if(!raf)raf=requestAnimationFrame(paint)},{passive:false});
 const end=()=>{if(y0==null)return;y0=null;if(raf){cancelAnimationFrame(raf);raf=0}if(!on)return;on=false;sheet.classList.remove('drag');
  const s0=samples[0],s1=samples[samples.length-1],v=s1&&s0&&s1.t>s0.t?(s1.y-s0.y)/(s1.t-s0.t):0,h=H();
  if(dy>Math.min(150,h*.28)||v>.55){const rem=Math.max(40,h*1.05-dy),dur=Math.round(Math.min(380,Math.max(170,rem/Math.max(v,1.4))));

   sheet.style.transform='translate3d(0,105%,0)';scrim.style.opacity='0';if(vIdx<0)document.body.style.overflow='';
   sheetT=setTimeout(()=>{scrim.classList.remove('on');sheet.style.transition='';scrim.style.transition='';sheet.style.transform='';scrim.style.opacity=''},dur+20)}
  else{sheet.style.transition='transform .46s cubic-bezier(.3,1.3,.5,1)';scrim.style.transition='opacity .3s ease';sheet.style.transform='';scrim.style.opacity='';
   sheetT=setTimeout(()=>{sheet.style.transition='';scrim.style.transition=''},480)}};

}

 out.data.letterBody=[];for(const l of letters){try{const r=await db.doc('letterBody/'+l.id).get();if(r.exists)out.data.letterBody.push({id:l.id,...r.data()})}catch(x){}}

 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){toast('اختار «حفظ في الملفات»');await navigator.share({files:[f],title:name});return}}catch(x){if(x&&x.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('انحفظت النسخة الاحتياطية');
